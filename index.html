<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <link rel="stylesheet" href="./resources/ol.css"> 
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        
        <title>MAPA DE ÁREAS DE RISCO - MONITORAMENTO GCN</title>

        <style>
        /* --- VARIÁVEIS DE COR --- */
        :root {
            --azul-escuro-transparente: rgba(11, 31, 60, 0.9); 
            --cor-primaria: #154a93;
            --cor-secundaria: #f8f8f8;
            --cor-alerta: #e53e3e;
            --cor-ia: #ffc107;
            --header-height: 84px; 
        }

        /* --- ESTILOS BASE E LAYOUT PRINCIPAL (FLEXBOX PARA OCUPAR A TELA) --- */
        html, body {
            background-color: #ffffff;
            margin: 0; 
            padding: 0;
            height: 100%; /* Ocupa 100% da altura do viewport */
            display: flex; 
            flex-direction: column; 
            overflow: hidden; /* Remove o scroll global, o scroll será interno ao sidebar */
            font-family: 'Inter', sans-serif; 
        }
        
        /* ESTILOS ORIGINAIS E CORREÇÕES DO QGIS2WEB (mantidos) */
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #154a93!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #154a93!important;
        }
        .search-layer-layer-search-autocomplete { 
            z-index: 2001; 
            top: 10px !important; 
            left: 10px !important;
            right: auto !important;
        }
        .search-layer-layer-search-autocomplete > button, 
        .search-layer-layer-search-autocomplete > input {
            background-color: var(--cor-secundaria) !important; 
            color: var(--cor-primaria) !important; 
            border: 1px solid var(--cor-primaria) !important;
        }
        .search-layer-layer-search-autocomplete > button:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        }
        .search-layer-layer-search-autocomplete .autocomplete-list {
            background-color: white;
            border: 1px solid var(--cor-primaria);
            color: #333;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        
        /* Reposicionamento do controle de zoom */
        .ol-zoom {
            top: auto !important;
            left: auto !important;
            bottom: 10px !important;
            right: 10px !important;
            position: absolute;
        }
        
        /* ESTILOS DO CABEÇALHO */
        #cabecalho-simples {
            background-color: var(--azul-escuro-transparente); 
            padding: 15px; 
            text-align: center; 
            width: 100%; 
            box-sizing: border-box;
            z-index: 2000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            flex-shrink: 0;
        }

        #cabecalho-simples h1 {
            font-size: 24px; 
            color: white; 
            font-weight: bold; 
            margin: 0; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* SEÇÃO SUPERIOR (SITES) */
        #top-content {
            display: flex; 
            flex-shrink: 0; 
            width: 100%;
            gap: 10px; 
            padding: 10px 15px;
            box-sizing: border-box;
            background-color: var(--cor-secundaria); 
            border-bottom: 2px solid #ccc;
            overflow-x: auto; 
        }
        
        /* CONTÊINER PRINCIPAL: MAPA + DIVISÓRIA + SIDEBAR */
        #main-content {
            display: flex; 
            flex-grow: 1; /* Permite que ocupe todo o espaço vertical restante */
            padding: 0; 
            background-color: #f0f0f0; 
            overflow: hidden; 
        }
        
        /* Barra arrastável */
        #dragbar {
            width: 8px; 
            cursor: ew-resize; 
            background-color: #d1d1d1;
            z-index: 1000; 
            flex-shrink: 0; 
        }

        /* AJUSTE DO MAPA (100% da área restante) */
        #map {
            width: 40%; 
            height: 100%; /* Ocupa 100% do #main-content */
            margin: 0;
            position: relative; 
            top: auto;
            min-height: 0;
            background-color: white; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.2); 
        }

        /* ESTILO PARA A SIDEBAR (100% da área restante) */
        #sidebar {
            width: 60%; 
            height: 100%; /* Ocupa 100% do #main-content */
            padding: 15px 15px 15px 10px; 
            box-sizing: border-box;
            overflow-y: auto; /* A rolagem é interna à sidebar */
            background-color: #ffffff; 
            padding-bottom: 20px; 
        }
        
        /* --- ESTILOS PARA CARDS (Estatísticas e Tempo) --- */
        .weather-card {
            background-color: var(--azul-escuro-transparente); 
            color: white;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            flex-grow: 1; 
            min-width: 400px; 
        }
        
        /* Ajuste de Margem para Cards do Topo */
        #top-content .weather-card {
            margin-bottom: 0; 
        }

        .weather-card h3 {
            font-weight: 700;
            font-size: 1.5em;
            margin-top: 0;
            margin-bottom: 10px;
            color: #ffd700; 
        }

        .weather-iframe-container {
            width: 100%;
            height: 350px; 
            overflow: hidden;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* AJUSTE AQUI: Altura original dos Iframes no Topo (250px) */
        #top-content .weather-iframe-container {
            height: 250px; 
        }
        
        #top-content .defesacivil-container {
            height: 250px; 
        }

        .weather-iframe-container iframe {
            width: 100%; 
            height: 100%;
            border: none;
        }
        
        /* Estilos dos Cards de Estatísticas */
        .card-row {
            display: flex;
            margin-bottom: 10px; 
            width: 100%;
            gap: 10px; 
        }

        .stat-card {
            background-color: transparent; 
            color: var(--azul-escuro-transparente); 
            padding: 15px; 
            box-sizing: border-box;
            text-align: center;
            line-height: 1.4; 
            font-size: 16px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--azul-escuro-transparente); 
            border-radius: 8px; 
            transition: all 0.3s ease; 
            flex-grow: 1; 
        }
        
        .title-card {
            font-weight: 600; 
            font-size: 18px; 
            padding: 15px; 
            background-color: var(--azul-escuro-transparente); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            text-transform: uppercase;
        }

        .region-row {
            margin-bottom: 10px;
            gap: 10px; 
        }
        .region-card {
            background-color: var(--azul-escuro-transparente); 
            color: white; 
            font-size: 18px; 
            padding: 20px 10px; 
            border: none; 
            border-radius: 8px;
            flex-grow: 1;
        }

        /* --- MEDIA QUERIES (RESPONSIVIDADE) --- */
        @media (max-width: 1024px) {
            
            #top-content {
                flex-direction: column; 
                padding: 10px;
            }
            #top-content .weather-card {
                min-width: 100%; 
                margin-bottom: 10px;
            }
            #top-content .weather-iframe-container, #top-content .defesacivil-container {
                height: 300px; 
            }

            #main-content {
                flex-direction: column; 
                overflow-y: auto;
            }
            #map {
                width: 100% !important; 
                height: 400px; 
            }
            #sidebar {
                width: 100% !important; 
                height: auto; 
                overflow-y: visible; 
                padding: 15px;
                padding-bottom: 20px; 
            }
            #dragbar {
                display: none; 
            }
            .card-row {
                flex-wrap: wrap; 
            }
            .stat-card {
                flex-basis: 48%; 
                margin-bottom: 10px;
            }
            .region-row .region-card {
                flex-basis: 23%; 
            }
            @media (max-width: 600px) {
                .region-row .region-card {
                    flex-basis: 48%; 
                }
            }
            .ol-zoom {
                right: 5px !important;
                bottom: 5px !important;
            }
        }
        
        /* --- ESTILOS DO POPUP OPENLAYERS (mantidos) --- */
        .ol-popup {
            position: absolute;
            background-color: white;

<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="initial-scale=1,user-scalable=no,maximum-scale=1,width=device-width">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        
        <link rel="stylesheet" href="./resources/ol.css"> 
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
        <link href="resources/photon-geocoder-autocomplete.min.css" rel="stylesheet">
        <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
        <link rel="stylesheet" href="./resources/qgis2web.css">
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
        
        <title>MAPA DE ÁREAS DE RISCO - MONITORAMENTO GCN</title>

        <style>
        /* --- VARIÁVEIS DE COR --- */
        :root {
            --azul-escuro-transparente: rgba(11, 31, 60, 0.9); 
            --cor-primaria: #154a93;
            --cor-secundaria: #f8f8f8;
            --cor-alerta: #e53e3e;
            --cor-ia: #ffc107;
        }

        /* --- ESTILOS BASE E LAYOUT PRINCIPAL (FLEXBOX) --- */
        html, body {
            background-color: #ffffff;
            margin: 0; 
            padding: 0;
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            font-family: 'Inter', sans-serif; 
        }
        
        /* ESTILOS ORIGINAIS E CORREÇÕES DO QGIS2WEB */
        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #154a93!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #154a93!important;
        }
        .search-layer-layer-search-autocomplete { 
            z-index: 2001; 
            top: 10px !important; 
            left: 10px !important;
            right: auto !important;
        }
        .search-layer-layer-search-autocomplete > button, 
        .search-layer-layer-search-autocomplete > input {
            background-color: var(--cor-secundaria) !important; 
            color: var(--cor-primaria) !important; 
            border: 1px solid var(--cor-primaria) !important;
        }
        .search-layer-layer-search-autocomplete > button:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        }
        .search-layer-layer-search-autocomplete .autocomplete-list {
            background-color: white;
            border: 1px solid var(--cor-primaria);
            color: #333;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        
        /* Reposicionamento do controle de zoom */
        .ol-zoom {
            top: auto !important;
            left: auto !important;
            bottom: 10px !important;
            right: 10px !important;
            position: absolute;
        }
        
        /* ESTILOS DO CABEÇALHO */
        #cabecalho-simples {
            background-color: var(--azul-escuro-transparente); 
            padding: 15px; 
            text-align: center; 
            width: 100%; 
            box-sizing: border-box;
            z-index: 2000;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        #cabecalho-simples h1 {
            font-size: 24px; 
            color: white; 
            font-weight: bold; 
            margin: 0; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* CONTÊINER PRINCIPAL: MAPA + DIVISÓRIA + SIDEBAR */
        #main-content {
            display: flex; 
            flex-grow: 1; 
            padding: 0; 
            background-color: #f0f0f0; 
        }
        
        /* NOVO: Barra arrastável */
        #dragbar {
            width: 8px; /* Largura da barra */
            cursor: ew-resize; /* Cursor para indicar redimensionamento horizontal */
            background-color: #d1d1d1;
            z-index: 1000; 
            flex-shrink: 0; /* Impede que seja esmagada */
        }

        /* AJUSTE DO MAPA (40% inicial) */
        #map {
            width: 40%; /* Largura inicial */
            height: 100%; 
            margin: 0;
            position: relative; 
            background-color: white; 
            box-shadow: 2px 0 5px rgba(0,0,0,0.2); 
        }

        /* ESTILO PARA A SIDEBAR (60% inicial) */
        #sidebar {
            width: 60%; /* Largura inicial */
            height: 100%;
            padding: 15px 15px 15px 10px; 
            box-sizing: border-box;
            overflow-y: auto; 
            background-color: #ffffff; 
            padding-bottom: 20px; /* Reduzido, pois o TTS sumiu */
        }
        
        /* --- ESTILOS PARA CARDS (Estatísticas e Tempo) --- */
        .weather-card {
            background-color: var(--azul-escuro-transparente); 
            color: white;
            padding: 15px;
            box-sizing: border-box;
            text-align: center;
            border-radius: 8px;
            margin-bottom: 20px; 
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .weather-card h3 {
            font-weight: 700;
            font-size: 1.5em;
            margin-top: 0;
            margin-bottom: 10px;
            color: #ffd700; 
        }

        .weather-iframe-container {
            width: 100%;
            height: 350px; /* Altura do iframe Epagri */
            overflow: hidden;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .weather-iframe-container iframe {
            width: 100%; 
            height: 100%;
            border: none;
        }
        
        .card-row {
            display: flex;
            margin-bottom: 10px; 
            width: 100%;
            gap: 10px; 
        }

        .stat-card {
            background-color: transparent; 
            color: var(--azul-escuro-transparente); 
            padding: 15px; 
            box-sizing: border-box;
            text-align: center;
            line-height: 1.4; 
            font-size: 16px; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--azul-escuro-transparente); 
            border-radius: 8px; 
            transition: all 0.3s ease; 
            flex-grow: 1; 
        }
        
        .title-card {
            font-weight: 600; 
            font-size: 18px; 
            padding: 15px; 
            background-color: var(--azul-escuro-transparente); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            text-transform: uppercase;
        }

        .region-row {
            margin-bottom: 10px;
            gap: 10px; 
        }
        .region-card {
            background-color: var(--azul-escuro-transparente); 
            color: white; 
            font-size: 18px; 
            padding: 20px 10px; 
            border: none; 
            border-radius: 8px;
            flex-grow: 1;
        }

        /* --- MEDIA QUERIES (RESPONSIVIDADE) --- */
        @media (max-width: 1024px) {
            #main-content {
                flex-direction: column; 
                overflow-y: auto;
            }
            #map {
                width: 100% !important; /* Força 100% no mobile */
                height: 400px; 
                box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
            }
            #sidebar {
                width: 100% !important; /* Força 100% no mobile */
                padding: 15px;
                padding-bottom: 20px; 
            }
            #dragbar {
                display: none; /* Esconde a barra arrastável em telas pequenas */
            }
            .card-row {
                flex-wrap: wrap; 
            }
            .stat-card {
                flex-basis: 48%; 
                margin-bottom: 10px;
            }
            .region-row .region-card {
                flex-basis: 23%; 
            }
            @media (max-width: 600px) {
                .region-row .region-card {
                    flex-basis: 48%; 
                }
            }
            .ol-zoom {
                right: 5px !important;
                bottom: 5px !important;
            }
        }
        
        /* --- ESTILOS DO POPUP OPENLAYERS --- */
        .ol-popup {
            position: absolute;
            background-color: white;
            box-shadow: 0 1px 4px rgba(0,0,0,0.2);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #cccccc;
            bottom: 12px;
            left: -50px;
            min-width: 250px;
            font-family: 'Inter', sans-serif;
            z-index: 100;
        }
        .ol-popup:after, .ol-popup:before {
            top: 100%;
            border: solid transparent;
            content: " ";
            height: 0;
            width: 0;
            position: absolute;
            pointer-events: none;
        }
        .ol-popup:after {
            border-top-color: white;
            border-width: 10px;
            left: 48px;
            margin-left: -10px;
        }
        .ol-popup:before {
            border-top-color: #cccccc;
            border-width: 11px;
            left: 48px;
            margin-left: -11px;
        }
        .ol-popup-closer {
            text-decoration: none;
            position: absolute;
            top: 2px;
            right: 8px;
            color: #333;
            font-size: 1.2em;
        }
        .ol-popup-closer:after {
            content: "✖";
        }
        #popup-content {
            max-height: 200px;
            overflow-y: auto;
            color: #333;
            font-size: 0.9em;
        }
        </style>
    </head>
    <body>
        
        <header id="cabecalho-simples">
            <h1>MAPA DE ÁREAS DE RISCO - MONITORAMENTO GCN</h1>
        </header>
        <div id="main-content">
            
            <div id="map">
                <div id="popup" class="ol-popup">
                    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                    <div id="popup-content"></div>
                </div>
            </div>
            
            <div id="dragbar"></div> 

            <div id="sidebar">
                
                <div class="weather-card">
                    <h3><i class="fas fa-cloud-sun"></i> Previsão do Tempo (CIRAM/Epagri)</h3>
                    <div class="weather-iframe-container">
                        <iframe 
                            src="https://ciram.epagri.sc.gov.br/index.php/previsao-municipio/" 
                            frameborder="0" 
                            allowfullscreen 
                            sandbox="allow-scripts allow-same-origin allow-forms"
                            title="Previsão do Tempo - CIRAM Epagri"
                            style="height: 100%; width: 100%;">
                        </iframe>
                    </div>
                    <p style="font-size: 0.8em; margin-top: 10px;">Fonte: CIRAM/Epagri - Previsão Municipal</p>
                </div>

                <div class="card-row">
                    <div class="stat-card">
                        Colaboradores <br> **120 AdviceHealth**
                    </div>
                    <div class="stat-card">
                        Colaboradores <br> **95 Mapeados**
                    </div>
                </div>

                <div class="card-row">
                    <div class="stat-card title-card">
                        Colaboradores por Região da Grande Florianópolis
                    </div>
                </div>

                <div class="card-row region-row">
                    <div class="stat-card region-card">
                        **Norte** <br> 15
                    </div>
                    <div class="stat-card region-card">
                        **Sul** <br> 40
                    </div>
                    <div class="stat-card region-card">
                        **Centro** <br> 25
                    </div>
                    <div class="stat-card region-card">
                        **Leste** <br> 15
                    </div>
                </div>
                
                </div>
        </div>

        <script src="./resources/Autolinker.min.js"></script>

        <script type="text/javascript">
        
        // --- INICIALIZAÇÃO DO POPUP OPENLAYERS ---
        var container = document.getElementById('popup');
        var content = document.getElementById('popup-content');
        var closer = document.getElementById('popup-closer');
        var popup = new ol.Overlay({
            element: container,
            autoPan: true,
            autoPanAnimation: {
                duration: 250
            }
        });
        
        // Adiciona o popup ao mapa (a variável 'map' é inicializada em qgis2web.js)
        if (typeof map !== 'undefined') {
            map.addOverlay(popup);
        }

        closer.onclick = function() {
            popup.setPosition(undefined);
            closer.blur();
            return false;
        };

        // --- FUNÇÃO DE REDIMENSIONAMENTO ARRASTÁVEL (DRAGBAR) ---
        const dragbar = document.getElementById('dragbar');
        const mapContainer = document.getElementById('map');
        const sidebar = document.getElementById('sidebar');
        const mainContent = document.getElementById('main-content');

        let isDragging = false;
        
        // Inicia o arrasto
        dragbar.addEventListener('mousedown', function(e) {
            e.preventDefault();
            // Verifica se o redimensionamento deve ser ativo (apenas em desktop)
            if (window.innerWidth > 1024) { 
                isDragging = true;
                // Adiciona classes para melhor feedback visual durante o arrasto
                document.body.style.cursor = 'ew-resize';
                mapContainer.style.userSelect = 'none';
                sidebar.style.userSelect = 'none';
            }
        });

        // Durante o arrasto
        document.addEventListener('mousemove', function(e) {
            if (!isDragging) return;
            
            // Obtém a posição da barra principal e do mouse
            const mainRect = mainContent.getBoundingClientRect();
            let newMapWidth = e.clientX - mainRect.left;
            
            // Calcula a largura total
            const totalWidth = mainRect.width;
            
            // Largura mínima do mapa e da sidebar (15% para evitar que desapareçam)
            const minWidth = totalWidth * 0.15;
            
            // Limita o novo tamanho
            // Limite inferior (Map min 15%)
            if (newMapWidth < minWidth) {
                newMapWidth = minWidth;
            }
            // Limite superior (Sidebar min 15%)
            if (totalWidth - newMapWidth - dragbar.offsetWidth < minWidth) {
                newMapWidth = totalWidth - minWidth - dragbar.offsetWidth;
            }

            // Aplica o novo tamanho (em pixels)
            mapContainer.style.width = newMapWidth + 'px';
            sidebar.style.width = (totalWidth - newMapWidth - dragbar.offsetWidth) + 'px';

            // Dispara o evento de redimensionamento do mapa OpenLayers
            if (typeof map !== 'undefined' && map) {
                map.updateSize();
            }
        });

        // Finaliza o arrasto
        document.addEventListener('mouseup', function() {
            isDragging = false;
            document.body.style.cursor = 'default';
            mapContainer.style.userSelect = 'auto';
            sidebar.style.userSelect = 'auto';
        });

        </script>
        
    </body>
